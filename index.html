/* ---------- 资源烘焙 ---------- */
function bake(img,h,noOutline){
  const r=h/img.height, w=Math.round(img.width*r);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d');
  cx.drawImage(img,0,0,w,h);
  try{  // 抬暗部(黑卫衣/黑金龙袍在暗背景上会糊成一坨)
    const lut=new Uint8Array(256);
    for(let i=0;i<256;i++) lut[i]=Math.round(6+249*Math.pow(i/255,0.78));
    const id=cx.getImageData(0,0,w,h), d=id.data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<8) continue;
      d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]];
    }
    cx.putImageData(id,0,0);
  }catch(e){}
  const f=document.createElement('canvas'); f.width=w; f.height=h;
  const fx=f.getContext('2d'); fx.translate(w,0); fx.scale(-1,1); fx.drawImage(c,0,0);
  const wh=document.createElement('canvas'); wh.width=w; wh.height=h;
  const wx=wh.getContext('2d'); wx.drawImage(c,0,0);
  wx.globalCompositeOperation='source-atop'; wx.fillStyle='#ffd9a0'; wx.fillRect(0,0,w,h);
  return {n:c,flip:f,white:wh,w,h};
}

const H_DU=H_SPR;
let ready=0;
const TOT=Object.keys(IMG).length;
function tick(){
  ++ready;
  const f=document.getElementById('lfill');
  if(f) f.style.width=Math.round(ready/TOT*100)+'%';
  if(ready>=TOT){
    const el=document.getElementById('load');
    if(el){ el.classList.add('done'); setTimeout(()=>{ el.remove(); },600); }
    start();
  }
}
for(const k in IMG){
  const im=new Image();
  im.onload=()=>{
    try{
      if(SPR.indexOf(k)>=0) A[k]=bake(im, (k.indexOf('du_')===0)?H_DU:H_SPR);
      else if(k==='yanF'||k==='liuF'||k==='wuF'||k==='duF'||k==='ycF') A[k]=bake(im,72).n;
      else if(k==='du_ko') A[k]=bake(im,300);
      else A[k]=im;
    }catch(e){ console.error('bake failed',k,e); }
    tick();
  };
  im.onerror=()=>{ console.error('image failed',k); tick(); };
  im.src=IMG[k];
}

  }
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,150,W,26);
  g.fillStyle='rgba(180,140,60,.16)';
  for(let i=0;i<52;i++) g.fillRect(20+i*24.6,150,14,26);
  const glow=g.createRadialGradient(640,300,40,640,300,520);
  glow.addColorStop(0,'rgba(255,196,90,.16)'); glow.addColorStop(1,'rgba(255,196,90,0)');

  let fl=g.createLinearGradient(0,GROUND,0,GROUND+40);
  fl.addColorStop(0,'rgba(255,205,110,.18)'); fl.addColorStop(1,'rgba(255,205,110,0)');
  g.fillStyle=fl; g.fillRect(0,GROUND,W,40);
  g.strokeStyle='rgba(140,110,70,.30)'; g.lineWidth=1;
  for(let i=0;i<=14;i++){ g.beginPath(); g.moveTo(640+(i-7)*70,GROUND); g.lineTo(640+(i-7)*260,H); g.stroke(); }
  for(let i=1;i<9;i++){ const y=GROUND+i*i*3.6; if(y>H) break;

})();

/* ---------- 角色 ---------- */
class Fighter{
  constructor(key,name){
    this.key=key; this.name=name; this.cfg=CHARS[key];
    this.reset(300,1);
  }
  reset(x,facing){
    this.x=x; this.y=GROUND; this.vy=0; this.facing=facing;
    this.hpMax=this.cfg.hp; this.hp=this.hpMax; this.hpShow=this.hpMax; this.meter=20;
    this.st='idle'; this.t=0; this.move=null; this.phase='su';
    this.hitDone=false; this.anim=Math.random()*100; this.flash=0; this.shake=0;
    this.koVx=0; this.koBounce=0; this.guard=false; this._ai=null; this.dizzy=0; this.aura=0;
  }
  get airborne(){ return this.y<GROUND-0.5 }
  canAct(){ return !this.airborne&&(this.st==='idle'||this.st==='walk'||this.st==='block'); }
  start(mv){ this.st='atk'; this.move=mv; this.t=0; this.phase='su'; this.hitDone=false;
    this.x+=this.facing*MOVES[mv].lunge*.35; }
  startSuper2(){
    this.st='super2'; this.t=0; this.meter=0; this.hitDone=false; this.aura=1;
  }
  beamHit(du){
    if(du.st==='ko'||this.hitDone) return;
    const dx=(du.x-this.x)*this.facing;
    if(!(dx>-60&&dx<1000&&Math.abs(du.y-this.y)<340)) return;   // 光束是直线, 够不着就空
    this.hitDone=true;
    du.hurt(BEAM[this.key].dmg*this.cfg.atk,7,this.facing);   // 小杜(沙包)击退要小, 免得撞墙角反弹
    // 单挑模式下打的是对手英杰, 用正常击退
    game.shake=34; game.flashc='rgba(214,246,255,'; game.flashw=.30;
    game.hits.push({x:(this.x+du.x)/2,y:du.y-240,t:0,f:this.facing,p:1.8,big:1});
  }
  hurt(dmg,kb,from){
    // 出龟派气功期间是霸体: 照样掉血但不会被打断
    const armored=(this.st==='super2');
    this.hp=Math.max(0,this.hp-dmg);
    this.x-=from*kb*(armored?1.1:4.0);
    if(this.hp<=0){
      this.st='ko'; this.t=0; this.vy=-16; this.koVx=from*6.5; this.koBounce=0;
      game.banner={txt:'K.O.',t:0,big:1}; game.shake=26;
      game.flashc='rgba(255,246,214,'; game.flashw=.55;
      return;
    }
    if(armored){ this.flash=.55; this.shake=6; return; }
    this.st='hurt'; this.t=0; this.flash=1; this.shake=Math.min(20,4+kb);
  }
  step(inp,du){
    this.t++; this.anim+=1;
    if(this.flash>0) this.flash-=.12;
    if(this.shake>0) this.shake*=.88;
    if(this.aura>0) this.aura-=.012;
    if(this.dizzy>0) this.dizzy--;
    const canCtl=this.canAct();

    if(this.st==='ko'){
      this.vy+=1.05; this.y+=this.vy; this.x+=this.koVx; this.koVx*=.93;
      if(this.y>=GROUND){
        this.y=GROUND;
        if(this.koBounce<1&&this.vy>4){ this.vy=-this.vy*.40; this.koBounce++; this.shake=9; }
        else { this.vy=0; this.koVx=0; }
      }
      this.x=Math.max(70,Math.min(W-180,this.x));
      return;
    }
    if(canCtl){
      if(inp.left||inp.right){
        const back=(inp.left&&this.facing>0)||(inp.right&&this.facing<0);
        this.guard=back; this.st=back?'block':'walk';
        this.x+=(inp.left?-1:1)*(back?3.1:4.4)*this.cfg.spd;
      } else if(this.st!=='idle') this.st='idle';
      if(this.guard) this.st='block';
      if(inp.up){ this.vy=-16.4; this.y=GROUND-6; this.st='jump'; this.t=0; }
      if(this.dizzy>0) this.st='idle';                       // 被投翔砸中会懵一会
      if(inp.sup2&&this.dizzy<=0&&this.meter>=100){ this.startSuper2(); }
      else if(inp.atkH&&this.dizzy<=0) this.start('H');
      else if(inp.atkL&&this.dizzy<=0) this.start('L');
    }
    if(this.airborne){
      this.vy+=.92; this.y+=this.vy;
      if(inp.left&&!this.guard) this.x-=2.2;
      if(inp.right) this.x+=2.2;
      if(this.y>=GROUND){ this.y=GROUND; this.vy=0; this.st='idle'; this.t=0; this.shake=4; }
    }
    if(this.st==='jump'&&!this.airborne){ this.y=GROUND; this.vy=0; this.st='idle'; }
    if(this.st==='hurt'&&this.t>16) this.st='idle';
    if(this.st==='super2'){
      if(this.t===BEAM_T) this.beamHit(du);
      if(this.t>BEAM_END) this.st='idle';
    }
    if(this.st==='atk'){
      const M=MOVES[this.move];
      if(this.phase==='su'&&this.t>=M.su){ this.phase='ac'; this.t=0; this.x+=this.facing*M.lunge*.65; }
      else if(this.phase==='ac'){
        if(!this.hitDone) this.tryHit(du,M);
        if(this.t>=M.ac){ this.phase='rc'; this.t=0; }
      } else if(this.phase==='rc'&&this.t>=M.rc){ this.st='idle'; this.move=null; }
    }
    this.x=Math.max(70,Math.min(W-180,this.x));
  }
  tryHit(du,M){
    if(du.st==='ko') return;
    const d=(du.x-this.x)*this.facing;
    if(d>20&&d<M.range+60&&Math.abs(du.y-this.y)<230){
      this.hitDone=true;
      // 目标可能是小杜(有 hurt), 也可能是对手英杰(走 Fighter.hurt)
      if(du.hurt) du.hurt(M.dmg*this.cfg.atk,M.kb,this.facing);
      else du.hurt(M.dmg*this.cfg.atk,M.kb,this.facing);   // 两者接口一致
      this.meter=Math.min(100,this.meter+M.meter);
      game.hits.push({x:(this.x+du.x)/2,y:du.y-230,t:0,f:this.facing,p:M.sfx,
        red: du.isFoe?1:0});
    }
  }
  spriteKey(){
    // 闫祖用肯德基老爷爷皮肤(yc_*), 其余用原立绘
    const k=(this.key==='yan')?'yc':this.key;
    if(this.st==='hurt'||this.st==='ko') return k+'_hurt';
    if(this.st==='atk') return k+'_atk';
    return k+'_idle';
  }
  draw(g){
    if(this.st==='ko'&&this.vy===0&&this.y>=GROUND-1) return;   // 英杰倒地用旋转, 无专用图
    const a=A[this.spriteKey()];
    if(!a) return;
    const bob=Math.sin(this.anim*.055)*5;
    let sy=this.y+bob, sx=this.x, rot=0, upper=0;
    if(this.st==='atk'){
      const M=MOVES[this.move]||MOVES.L;
      if(this.phase==='su'){ const k=Math.min(1,this.t/M.su); rot=-this.facing*.05*k; upper=-this.facing*.11*k; }
      else if(this.phase==='ac'){ rot=this.facing*.07; upper=this.facing*.19; }
      else { rot=-this.facing*.03; upper=-this.facing*.05; }
    }
    else if(this.st==='hurt'){ rot=this.facing*.15; upper=-this.facing*.15; }
    else if(this.st==='block'){ rot=-this.facing*.06; upper=-this.facing*.10; }
    else if(this.st==='ko'){
      const air=this.y<GROUND-1;
      rot=air?this.facing*(.30+Math.min(1.5,Math.abs(this.vy)*.075)):this.facing*.42;
      upper=air?this.facing*.16:this.facing*.10;
    }
    else if(this.st==='walk'){ upper=Math.sin(this.anim*.16)*.035; }
    else { upper=Math.sin(this.anim*.05)*.012; }
    if(this.dizzy>0){ rot+=Math.sin(this.anim*.5)*.05; }        // 投翔命中后的懵圈摇晃

    const imgS=(this.facing>0)?a.n:a.flip;
    g.save(); g.translate(sx,sy+18);
    const sw=imgS.width*.30;
    const sgr=g.createRadialGradient(0,0,2,0,0,sw);
    sgr.addColorStop(0,'rgba(0,0,0,.55)'); sgr.addColorStop(.5,'rgba(0,0,0,.26)');
    sgr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sgr; g.beginPath(); g.ellipse(0,0,sw,sw*.17,0,0,6.29); g.fill(); g.restore();

    g.save(); g.translate(sx,sy+22); g.rotate(rot);
    const img=imgS, dx=-img.width/2, dy=-img.height;
    if(this.flash>0){
      g.globalAlpha=Math.min(.85,this.flash);
      g.drawImage(a.white,dx,dy); g.globalAlpha=1;
    }
    const TOP=.50, hT=img.height*TOP, hB=img.height-hT, ov=14;
    g.drawImage(img,0,hT,img.width,hB,dx,dy+hT,img.width,hB);
    g.save(); g.translate(0,dy+hT); g.rotate(upper);
    g.drawImage(img,0,0,img.width,hT+ov,dx,-(hT+ov),img.width,hT+ov);
    g.restore(); g.restore();

    if(this.st==='atk'&&this.phase==='ac'){
      const M=MOVES[this.move], hx=sx+this.facing*(M.range*.72), hy=sy-232;
      g.save(); g.globalAlpha=.85;
      const rg=g.createRadialGradient(hx,hy,4,hx,hy,74*M.sfx+.6);
      rg.addColorStop(0,'rgba(255,255,235,.95)'); rg.addColorStop(.3,'rgba(255,214,110,.65)');
      rg.addColorStop(1,'rgba(255,150,40,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(hx,hy,74,0,6.29); g.fill();
      g.strokeStyle='rgba(255,240,190,.9)'; g.lineWidth=3;
      for(let i=0;i<7;i++){ const an=(i/7)*6.28+this.anim*.2;
        g.beginPath(); g.moveTo(hx+Math.cos(an)*16,hy+Math.sin(an)*16);
        g.lineTo(hx+Math.cos(an)*(34+M.sfx*30),hy+Math.sin(an)*(34+M.sfx*30)); g.stroke(); }
      g.restore();
    }
    if(this.guard&&!this.airborne){
      const pu=.5+Math.abs(Math.sin(this.anim*.12))*.4;
      g.save(); g.globalAlpha=pu; g.strokeStyle='#a8e8ff'; g.lineWidth=6;
      g.beginPath(); g.arc(sx+this.facing*46,sy-215,94,-1.15,1.15); g.stroke();
      g.globalAlpha=pu*.45; g.lineWidth=15;
      g.beginPath(); g.arc(sx+this.facing*46,sy-215,94,-1.0,1.0); g.stroke();
      g.restore();
    }
  }
}

/* ---------- 小杜: 血厚、无攻击力的沙包 ---------- */
class Du{
  constructor(){
    this.key='du'; this.name='小杜';
    this.poops=[]; this.redT=0; this.rageT=0;
    this.skillCd=200; this.face=-1; this.enter=0; this.squash=0;
    this.koVx=0; this.koBounce=0; this.rot=0; this.turnT=0; this.dodge=0; this.hidden=false;
    this.reset();
  }
  reset(){
    this.x=830; this.y=-190; this.vy=0;
    this.hpMax=DU_HP; this.hp=DU_HP; this.hpShow=DU_HP;
    this.poops.length=0; this.redT=0; this.rageT=0; this.skillCd=200;
    this.face=-1; this.enter=0; this.squash=0; this.rot=0; this.turnT=0; this.dodge=0;
    this.st='enter'; this.t=0; this.anim=0; this.flash=0; this.shake=0;
  }
  show(){ this.hidden=false; this.st='idle'; this.enter=0; this.rot=0; this.squash=0; this.dodge=0; this.redT=0; this.rageT=0; this.poops.length=0; this.t=0; }
  hide(){ this.hidden=true; this.x=-999; }
  get airborne(){ return this.y<GROUND-0.5 }
  hurt(dmg,kb,from){
    if(this.st==='ko') return;
    this.hp=Math.max(0,this.hp-dmg);
    this.flash=1; this.shake=Math.min(18,3+kb*.7);
    // 小杜被推走时【自己往回挪一点】: 他是"被围殴的沙包", 不该被推得满场跑,
    // 否则会撞到墙角反弹, 把围殴他的 AI 全挤成一堆。
    this.x-=from*kb*2.4;
    const lo=300, hi=W-260;
    if(this.x<lo) this.x=lo+Math.abs(this.x-lo)*.4;
    if(this.x>hi) this.x=hi-Math.abs(this.x-hi)*.4;
    if(this.redT>0) this.redT=Math.max(0,this.redT-6);   // 挨打会让红温退一点
    if(this.hp<=0){
      this.st='ko'; this.t=0; this.vy=-15; this.koVx=from*5.5; this.koBounce=0;
      game.banner={txt:'K.O.',t:0,big:1}; game.shake=34;
      game.flashc='rgba(255,246,214,'; game.flashw=.7;
    }
  }
  step(heroes){
    if(this.hidden) return;
    this.t++; this.anim++;
    if(this.flash>0) this.flash-=.12;
    if(this.shake>0) this.shake*=.88;
    if(this.squash>0) this.squash-=.05;

    // 出场: 王从天降 → 砸地 → 摔倒扑街 → 慢慢爬起来
    if(this.st==='enter'){
      this.enter++;
      if(this.enter<=32){
        // 阶段一: 从天而降(重力积分)。落在画面上方一点, 能看见人
        this.vy+=1.5; this.y+=this.vy;
        if(this.y>=GROUND){ this.y=GROUND; this.vy=0; this.enter=32; game.shake=32; game.flashw=.5; }
      } else if(this.enter<=52){
        // 阶段二: 砸地压扁
        this.squash=Math.max(0,1-(this.enter-32)/20);
        this.y=GROUND;
        this.face=-1;                       // 落地就朝左(面向来袭的英杰)
      } else if(this.enter<=72){
        // 阶段三: 摔倒扑街。分段做才逼真:
        //   先仰头后仰(失重) → 再整体前扑(脸先着地) → 落地弹一下 → 趴定
        const k=(this.enter-52)/20;
        if(k<.35){                          // 仰面后仰, 双脚离地
          const kk=k/.35;
          this.rot=-kk*.30;                  // 往后仰(负=反向)
          this.y=GROUND-Math.sin(kk*Math.PI*.5)*16;
          this.squash=0;
        } else if(k<.62){                    // 前扑, 脸朝下
          const kk=(k-.35)/.27;
          this.rot=-.30+kk*1.62;             // 从后仰转到朝下
          this.y=GROUND-Math.sin(kk*Math.PI)*14;
          this.squash=kk*.34;                // 轻微纵向压缩 = 加速感
        } else if(k<.80){                    // 脸着地砸实 + 弹一下
          const kk=(k-.62)/.18;
          this.rot=1.32;
          this.squash=.34-Math.sin(kk*Math.PI)*.30;
          this.y=GROUND-Math.sin(kk*Math.PI)*13;
        } else {                             // 趴在地上不动
          this.rot=1.32; this.squash=.04; this.y=GROUND;
        }
      } else if(this.enter<=94){
        // 阶段四: 慢慢爬起来(先撑起上身, 再站直)
        const k=(this.enter-72)/22;
        this.rot=1.32*(1-k);
        this.squash=.04*(1-k);
        this.y=GROUND;
        this.face=-1;
      } else { this.st='idle'; this.t=0; this.y=GROUND; this.vy=0; this.rot=0; this.squash=0; }
      this.face=-1;
      return;
    }
    if(this.st==='ko'){
      this.vy+=1.05; this.y+=this.vy; this.x+=this.koVx; this.koVx*=.93;
      if(this.y>=GROUND){
        this.y=GROUND;
        if(this.koBounce<1&&this.vy>4){ this.vy=-this.vy*.38; this.koBounce++; game.shake=10; }
        else { this.vy=0; this.koVx=0; }
      }
      return;
    }
    if(this.redT>0) this.redT--;
    if(this.rageT>0) this.rageT--;
    if(!this.airborne&&this.st!=='enter') this.y=GROUND;

    // 技能循环: 无能狂怒 → 投翔 → 红温, 循环放, 一次都不掉血
    if(this.t>this.skillCd){
      const r=Math.random();
      if(this.rageT<=0 && this.redT<=0 && r<.4){ this.rageT=110; this.skillCd=this.t+190; }
      else if(r<.78){ this.throwPoop(heroes); this.skillCd=this.t+150; }
      else { this.redT=130; this.skillCd=this.t+170; }
    }
    // 投翔飞行物
    for(let i=this.poops.length-1;i>=0;i--){
      const p=this.poops[i];
      p.t++; p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.t>p.life){ this.poops.splice(i,1); continue; }
      // 命中英雄: 不掉血, 只是把人砸懵 + 溅一堆
      for(const h of heroes){
        if(h.st==='ko') continue;
        if(Math.abs(h.x-p.x)<70 && p.y>h.y-320 && p.y<h.y+40){
          p.hit=1; p.life=Math.min(p.life,p.t+14);   // 命中后很快消散
          // ★ 霸体: 正在放龟派气功时, 投翔只让他晃一下, 绝不能打断光束。
          //   (之前这里无条件 st='hurt', 会把 super2 状态顶掉 → 光束放不出来)
          if(h.st==='super2'){
            h.flash=.7; h.shake=Math.max(h.shake,12);
          } else {
            h.dizzy=54; h.shake=16; h.st='hurt'; h.t=0;
          }
          game.hits.push({x:p.x,y:p.y,t:0,f:1,p:.5,blocked:1,poop:1});
          break;
        }
      }
    }
    // 面朝最近的英杰。
    // 关键: 小杜固定「朝左」挨打(他是被围殴的一方, 英杰从左边来),
    // 面朝最近的英杰。
    // 小杜固定朝左挨打(他被围殴, 英杰从左边来)。
    // ★ 关键: 立绘是对称正面站姿, 光靠 face 翻转视觉上看不出转向,
    //   所以额外用 dodge 姿态(后仰侧让) + 身体压低来表达"缩着挨打"。
    let near=null, nd=1e9;
    for(const h of heroes){ if(h.st==='ko') continue; const d=Math.abs(h.x-this.x); if(d<nd){ nd=d; near=h; } }
    if(near){
      const want=(near.x>=this.x)?1:-1;
      if(want!==this.face) this.turnT=16;          // 起转
      else if(this.turnT>0) this.turnT--;          // 转到位
      this.face=this.turnT>0 ? -this.face : want;   // 转身中用旧朝向, 到位才换
      // 有人贴脸(要挨打了)就缩起来: dodge 拉满
      const threat=Math.abs(near.x-this.x);
      const want_dodge = threat<230 ? 1 : 0;
      this.dodge += (want_dodge-this.dodge)*.12;     // 平滑过渡, 不是硬切
    }
    // 右侧留出触摸按钮的空间(按钮 x 从 918 起), 免得小杜被压在按钮下面
    this.x=Math.max(300,Math.min(W-260,this.x));
  }
  throwPoop(heroes){
    const tgt=heroes.filter(h=>h.st!=='ko');
    if(!tgt.length) return;
    const h=tgt.reduce((p,c)=>Math.abs(c.x-this.x)<Math.abs(p.x-this.x)?c:p);
    // 抛射初速解算: 每帧 vy+=G, y+=vy, 要 T 帧后命中目标点
    //   dy = v0*T + G*T*(T-1)/2   →   v0 = (dy - G*T*(T-1)/2)/T
    const G=.42, T=50;
    const sx=this.x+this.face*46, sy=this.y-196;
    const dx=h.x-sx, dy=(h.y-150)-sy;
    const v0=(dy-G*T*(T-1)/2)/T;
    this.poops.push({ x:sx, y:sy, vx:dx/T, vy:v0,
      rot:0, vr:.30, t:0, life:T+40, hit:0, sx:sx, sy:sy });
  }
  draw(g){
    if(this.hidden) return;
    if(this.st==='ko'&&this.vy===0&&this.y>=GROUND-1){
      const ko=A.du_ko;
      if(ko){
        const img=(this.face>0)?ko.n:ko.flip;
        g.save(); g.globalAlpha=.95;
        const kw=img.width*.86, kh=img.height*.86;
        g.fillStyle='rgba(0,0,0,.5)';
        g.beginPath(); g.ellipse(this.x,GROUND+8,kw*.40,kh*.13,0,0,6.29); g.fill();
        g.drawImage(img,this.x-img.width/2,GROUND+8-img.height);
        g.restore();
      }
      return;
    }
    const a=(this.st==='ko')?A.du_hurt:A.du_idle;
    if(!a) return;
    // ★ 小杜的立绘原图就是朝左的(脸心 x=0.411w), 而 bake 的 flip 是水平镜像 → 朝右。
    //   所以朝向映射跟 Fighter 相反: face<0(朝左) 用原图 n, face>0(朝右) 用 flip。
    const imgS=(this.face>0)?a.flip:a.n;
    // 出场坠落: 高速下坠带残影
    g.save();
    if(this.st==='enter'&&this.enter<32&&this.vy>6){    // 高速下坠拉残影
      for(let i=1;i<=3;i++){
        g.globalAlpha=.15*i;
        g.drawImage(imgS,this.x-imgS.width/2,this.y+22+i*24-imgS.height);
      }
      g.globalAlpha=1;
    }
    const bob=this.st==='idle'?Math.sin(this.anim*.05)*4:0;
    // 影子
    g.save(); g.translate(this.x,GROUND+16);
    const sw=imgS.width*.30*Math.max(.4,1-(GROUND-this.y)/900);
    const sgr=g.createRadialGradient(0,0,2,0,0,sw);
    sgr.addColorStop(0,'rgba(0,0,0,.55)'); sgr.addColorStop(.5,'rgba(0,0,0,.24)');
    sgr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=sgr; g.beginPath(); g.ellipse(0,0,sw,sw*.17,0,0,6.29); g.fill(); g.restore();

    let sx=this.x, sy=this.y+bob+22, rot=this.rot||0, sxScale=1, syScale=1;
    if(this.squash>0){                                   // 砸地压扁
      syScale=1-this.squash*.42; sxScale=1+this.squash*.34;
    } else if(this.rageT>0){                            // 无能狂怒: 跳脚 + 抖
      const k=this.rageT;
      sy+=Math.abs(Math.sin(this.anim*.55))*18*(k/110);
      rot+=Math.sin(this.anim*.55)*.045*(k/110);
    } else if(this.st==='ko'){
      const air=this.y<GROUND-1;
      rot=air?this.face*(.34+Math.min(1.4,Math.abs(this.vy)*.08)):this.face*.40;
    } else if(this.dodge>0.02){
      // 缩着挨打: 只做【后仰 + 侧让 + 轻微上抬】, 绝不能压低身体。
      // ★ 之前加了 syScale=1-dg*.16, 结果小杜一挨打就变矮 —— 去掉纵向压缩。
      const dg=this.dodge;
      rot=this.face*-dg*.15;                  // 身体朝来袭方向后仰
      sx+=this.face*-dg*15;                   // 略微缩向来袭方向一侧
      sy-=dg*6;                                // 稍微"浮"起来一点点, 不是蹲
      sxScale=1+dg*.03;
    }
    g.save();
    g.translate(sx,sy); g.rotate(rot); g.scale(sxScale,syScale);
    if(this.flash>0){
      g.globalAlpha=Math.min(.9,this.flash);
      g.drawImage(a.white,-imgS.width/2,-imgS.height);
      g.globalAlpha=1;
    }
    g.drawImage(imgS,-imgS.width/2,-imgS.height);
    // 红温: 整张脸全部涨红 + 冒热气
    // ★ 坐标是用肤色像素从 du_idle.webp 实测的, 不要凭感觉改:
    //   原图脸心 x=0.411*w → 翻转后 x=0.589*w → canvas 偏移 +0.089*w
    //   脸半径 0.239*w; y 中心 -0.891*h, 半径 0.092*h
    if(this.redT>0){
      const pulse=.62+Math.abs(Math.sin(this.anim*.28))*.38;
      g.save();
      const FX=imgS.width*.089, FY=-imgS.height*.891;
      const RX=imgS.width*.245, RY=imgS.height*.092;
      // 1. 先铺一层大面积低透明红, 保证整张脸(含耳朵/额头/下巴)都在内
      const rgAll=g.createRadialGradient(FX,FY,RX*.20,FX,FY,RX*1.9);
      rgAll.addColorStop(0,'rgba(255,44,26,.92)');
      rgAll.addColorStop(.55,'rgba(255,64,44,.72)');
      rgAll.addColorStop(1,'rgba(255,96,76,0)');
      g.globalAlpha=pulse;
      g.fillStyle=rgAll;
      g.beginPath(); g.ellipse(FX,FY,RX*1.9,RY*4.2,0,0,6.29); g.fill();
      // 2. 再叠一层浓红核心, 压实"脸红"的观感
      const rgCore=g.createRadialGradient(FX,FY,RX*.10,FX,FY,RX*1.05);
      rgCore.addColorStop(0,'rgba(255,24,10,.98)');
      rgCore.addColorStop(.55,'rgba(255,44,26,.80)');
      rgCore.addColorStop(1,'rgba(255,70,50,0)');
      g.globalAlpha=pulse*.92;
      g.fillStyle=rgCore;
      g.beginPath(); g.ellipse(FX,FY,RX*1.05,RY*2.4,0,0,6.29); g.fill();
      // 3. 脖子跟上
      g.globalAlpha=pulse*.55;
      g.fillStyle='rgba(255,56,36,.55)';
      g.beginPath(); g.ellipse(FX,-imgS.height*.795,RX*.62,RY*.90,0,0,6.29); g.fill();
      g.restore();
      // 头顶蒸汽
      g.save(); g.globalAlpha=pulse*.55;
      for(let i=0;i<4;i++){
        const ph=(this.anim*.05+i*.25)%1;
        const yy=-imgS.height*1.02-ph*54;
        const rr=9+ph*17;
        const rg=g.createRadialGradient(this.face*rr,yy,1,this.face*rr,yy,rr);
        rg.addColorStop(0,'rgba(255,240,220,.85)'); rg.addColorStop(1,'rgba(255,200,180,0)');
        g.fillStyle=rg; g.beginPath(); g.arc(this.face*rr,yy,rr,0,6.29); g.fill();
      }
      g.restore();
    }
    g.restore();

    // 无能狂怒: 头顶青筋 + 乱窜的小怒气
    if(this.rageT>0){
      g.save(); g.globalAlpha=Math.min(1,this.rageT/30);
      for(let i=0;i<5;i++){
        const an=this.anim*.24+i*1.256;
        const rx=this.x+Math.cos(an)*50+this.face*6, ry=this.y-300+Math.sin(an)*18;
        g.strokeStyle='rgba(255,110,60,.9)'; g.lineWidth=3;
        g.beginPath(); g.moveTo(rx-7,ry-7); g.lineTo(rx+7,ry+7);
        g.moveTo(rx+7,ry-7); g.lineTo(rx-7,ry+7); g.stroke();
      }
      g.restore();
    }
    // 投翔飞行物 + 轨迹
    for(const p of this.poops){
      const im=A.poop;
      g.save();
      g.globalAlpha=p.t<p.life-30?1:Math.max(0,(p.life-p.t)/30);
      // 抛物线虚影
      for(let i=1;i<=4;i++){
        const k=i*.10;
        g.globalAlpha=(p.t<p.life-30?1:Math.max(0,(p.life-p.t)/30))*.16;
        g.drawImage(im,p.sx+(p.x-p.sx)*k-im.width/2,p.sy+(p.y-p.sy)*k-im.height/2);
      }
      g.globalAlpha=p.t<p.life-30?1:Math.max(0,(p.life-p.t)/30);
      g.translate(p.x,p.y); g.rotate(p.rot);
      if(im) g.drawImage(im,-im.width/2,-im.height/2);
      else { g.fillStyle='#8a5c2c'; g.beginPath(); g.arc(0,0,16,0,6.29); g.fill(); }
      g.restore();
      // 飞行尾迹
      g.save(); g.globalAlpha=.35; g.strokeStyle='rgba(150,110,60,.9)'; g.lineWidth=3;
      g.beginPath(); g.moveTo(p.sx,p.sy-40); g.quadraticCurveTo((p.sx+p.x)/2,Math.min(p.sy,p.y)-90,p.x,p.y-18);
      g.stroke(); g.restore();
    }
    // 技能名做成跟随头顶的小标签, 带底板避免与立绘糊在一起
    if(this.st!=='ko'){
      const tags=[];
      if(this.rageT>0) tags.push(['无能狂怒','#ff7a3c']);
      if(this.redT>0)  tags.push(['红温','#ff4a2c']);
      if(this.poops.length) tags.push(['投翔','#c08a4a']);
      if(tags.length){
        g.save(); g.textAlign='center';
        g.font='500 17px "PingFang SC",sans-serif';
        const ty=this.y-imgS.height-24-Math.max(0,(GROUND-this.y));
        tags.forEach((tg,i)=>{
          const tw=ctx.measureText(tg[0]).width+18;
          const tx=this.x-tw/2, tyy=ty-i*24;
          g.fillStyle='rgba(12,6,10,.72)';
          g.fillRect(tx,tyy-15,tw,21);
          g.strokeStyle=tg[1]; g.lineWidth=1.5; g.strokeRect(tx,tyy-15,tw,21);
          g.fillStyle=tg[1]; g.fillText(tg[0],this.x,tyy);
        });
        g.restore();
      }
    }
  }
}

const keys={};
const PMAP={l:'KeyA',r:'KeyD',u:'KeyW',l2:'KeyF',h2:'KeyG',s2:'KeyT'};
const touch={p1:{l:0,r:0,j:0,f:0,g:0}};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) keys[e.code+'_p']=1;
  keys[e.code]=1;
  game.onKey(e.code);
});
addEventListener('keyup',e=>{ keys[e.code]=0; });

function readInput(){
  const t=touch.p1, inp={};
  inp.left = !!keys[PMAP.l] || !!t.l;
  inp.right= !!keys[PMAP.r] || !!t.r;
  inp.up   = !!keys[PMAP.u+'_p'] || !!t.j;
  inp.atkL = !!keys[PMAP.l2+'_p'] || t.f===1;
  inp.atkH = !!keys[PMAP.h2+'_p'] || t.g===1;
  inp.sup2 = !!keys[PMAP.s2+'_p'];
  return inp;
}
// 单挑 P2: 方向键 + J/K/L
function readInput2(){
  const inp={};
  inp.left = !!keys.ArrowLeft;  inp.right= !!keys.ArrowRight;
  inp.up   = !!keys.ArrowUp+'_p';
  inp.atkL = !!keys.KeyJ+'_p';   inp.atkH= !!keys.KeyK+'_p';
  inp.sup2 = !!keys.KeyL+'_p';
  return inp;
}
function clearEdge(){
  for(const k in keys) if(k.endsWith('_p')) keys[k]=0;
  touch.p1.j=touch.p1.f=touch.p1.g=0;
}   // P2 的 _p 也在上面的循环里一起清了

/* ---------- 队友 AI: 三个英杰围殴小杜 ----------
   ★ 迭代过三轮的用户反馈:
     v1 "AI 排队打不到小杜" —— 根因是队友互推(md=118), 后排被顶住进不了射程。
        修法: AI 之间不互推。
     v2 "闫祖一直在跳也没打人" —— 根因是 blocked 检测把【玩家】也算成障碍,
        而 hop 分支优先级高于攻击分支, 于是 AI 一直跳。
        修法: ①「能打就打」优先级最高, 不看 blocked;
             ② hop 只在【已经贴到小杜身上却还打不到】时才触发(说明被队友卡住);
             ③ 寻敌只看小杜, 不看队友, blocked 仅用于 hop 判定;
             ④ hop 后强制接一次攻击, 避免"跳完就站着的空转"。
     伤害判定只看「射程内有没有小杜」, 与站位无关 —— 所以到位就一定打得着。 */
function allyInput(me,du,lvl){
  const o={left:0,right:0,up:0,atkL:0,atkH:0};
  if(me.st==='ko'||game.state!=='fight'||du.st==='ko') return o;
  me._ai=me._ai||{t:0,act:null,hold:0};
  const s=me._ai; s.t++;
  const d=Math.abs(du.x-me.x), dir=(du.x>me.x)?1:-1;
  const goFwd=()=>{ if(dir>0)o.right=1; else o.left=1; };
  const inL=(r)=> d>20 && d<r;
  const stuck = d<170 && !inL(210);      // 贴很近还打不到 = 中间隔了人

  /* ★★★ 站位方案(用户定的): 不做队形限制, 也不设"让路"。
     因为【AI 之间完全不互推】+【AI 不推小杜】, 它们会一路走到射程内(inL(200))
     就停下来出手 —— 三个人自然并排站在小杜面前, 谁都打得到。
     之前试过的 sidestep / queue 全是反效果: 把 AI 挪开反而让它们离开射程,
     玩家前进时还会撞上正在横移的 AI。 */

  if(s.hold>0) s.hold--; else s.act=null;
  if(!s.act&&s.t%7===0){
    const r=Math.random();
    if(me.meter>=100&&inL(700)&&!stuck){ s.act='beam'; s.hold=6; }
    else if(inL(200)){ s.act=(r<(lvl?.72:.5))?'atkH':'atkL'; s.hold=14+Math.random()*14; }
    else if(d<265){ s.act=(r<.55)?'atkL':'atkH'; s.hold=12+Math.random()*12; }
    else if(stuck){ s.act='hop'; s.hold=26; s.hopThenAtk=true; }
    else { s.act='fwd'; s.hold=16+Math.random()*16; }
  }
  if(s.hopThenAtk && me.y>=GROUND-.5 && me.vy===0){
    s.hopThenAtk=false; s.act=(Math.random()<.5)?'atkH':'atkL'; s.hold=14;
  }
  switch(s.act){
    case 'fwd': goFwd(); break;
    case 'atkL': if(inL(230)) o.atkL=1; else goFwd(); break;
    case 'atkH': if(inL(280)) o.atkH=1; else goFwd(); break;
    case 'beam': o.sup2=1; break;
    case 'hop': o.up=1; goFwd(); break;
  }
  return o;
}

var game={
  state:'title', t:0, hits:[], shake:0, flashw:0, flashc:'rgba(255,246,214,',
  banner:null, frames:0, ko:0, timer:99, touch:false, pick:2, mode:'tri', round:1, wins:[0,0],
  onKey(code){
    if(this.state==='title'){
      // Q 切换模式: tri=三英战小杜 / duel=刘祖闫祖单挑
      if(code==='KeyQ'){ this.mode=this.mode==='tri'?'duel':'tri'; return; }
      if(code==='Enter'){ this.begin(); return; }
      if(this.mode==='duel'){
        // 单挑: 1=闫祖 VS 刘祖, 2=刘祖 VS 闫祖, 3=AI 对战
        if(code==='Digit1'){ this.pick=0; this.begin(); }
        if(code==='Digit2'){ this.pick=1; this.begin(); }
        if(code==='Digit3'){ this.pick=-1; this.begin(); }
      } else {
        if(code==='Digit1'){ this.pick=0; this.begin(); }
        if(code==='Digit2'){ this.pick=1; this.begin(); }
        if(code==='Digit3'){ this.pick=2; this.begin(); }
      }
      return;
    }
    if(this.state==='over'&&(code==='Space'||code==='Enter')){ this.state='title'; this.t=0; }
  },
  beginDuel(){
    // 单挑模式: 只有两个英杰(肯爷爷 vs 刘祖), 吴祖不参战
    DU.hide();
    this.mode='duel'; this.timer=99; this.hits=[]; this.ko=0; this.banner=null;
    this.round=1; this.wins=[0,0];
    this.newRoundDuel();
    this.state='ready'; this.t=0;
    const el=document.getElementById('hint');
    if(el) el.textContent='P1 闫祖 A/D 移动 · W 跳 · F 轻掌 · G 重掌 · T 龟派气功　　P2 刘祖 ←/→ 移动 · ↑ 跳 · J 轻掌 · K 重掌 · L 龟派气功';
  },
  newRoundDuel(){
    const A1=DUEL[0], A2=DUEL[1];
    A1.reset(340,1); A2.reset(940,-1);
    this.timer=99; this.hits=[]; this.ko=0;
    this.state='ready'; this.t=0;
    this.banner={txt:'第 '+this.round+' 回合',t:0};
  },
  begin(){
    if(this.mode==='duel') return this.beginDuel();
    DU.show();
    this.pick = this.pick==null ? 2 : this.pick;
    HEROES.forEach((h,i)=>{
      h.reset(280+i*130,1);
      h.isPlayer=(i===this.pick);
    });
    DU.reset();
    this.timer=99; this.hits=[]; this.ko=0; this.banner=null;
    this.state='ready'; this.t=0;
    const el=document.getElementById('hint');
    if(el) el.textContent='你操控'+HEROES[this.pick].name+'　A/D 移动 · W 跳 · F 轻掌 · G 重掌 · T 龟派气功（气满时）　　另外两位是 AI 队友';
  }
};
var HEROES=[ new Fighter('yan','闫祖'), new Fighter('liu','刘祖'), new Fighter('wu','吴祖') ];
var DU=new Du();
var DUEL=[HEROES[0],HEROES[1]];   // 单挑: 肯爷爷 vs 刘祖

function stepPhase(){
  if(game.state==='ready'){
    game.t++;
    if(game.mode==='duel'){                  // 单挑: 无出场演出
      if(game.t>=70) game.state='fight';
      if(game.flashw>0) game.flashw-=.06;
      return;
    }
    DU.step(HEROES);                          // 出场演出从第 1 帧就跑, 不空等
    if(game.t===40) game.banner={txt:'三 英 战 小 杜',t:0};
    if(game.t>=118) game.state='fight';
    if(game.flashw>0) game.flashw-=.06;
    return;
  }
  if(game.state==='duelFight'){ stepDuel(); return; }
  if(game.state!=='fight'){ game.t++; return; }
  if(game.mode==='duel'){ stepDuel(); return; }

  // 只有非玩家操控的角色才走 AI
  const inputs=HEROES.map(h=> h.isPlayer ? readInput() : allyInput(h,DU,h.key==='yan'?2:1));
  HEROES.forEach((h,i)=>h.step(inputs[i],DU));
  DU.step(HEROES);
  clearEdge();

  // 朝向
  for(const h of HEROES){
    if(!h.airborne&&h.st!=='atk'&&h.st!=='hurt') h.facing=(DU.x>=h.x)?1:-1;
  }
  // 推挤
  // ★ 只在【玩家 vs 其他人】之间推。AI 之间不推 —— 否则三个 AI 会挤成一列,
  //   后排的顶住前排进不了攻击距离(用户报过"AI 排队打不到小杜")。
  for(let i=0;i<HEROES.length;i++)for(let j=i+1;j<HEROES.length;j++){
    const A1=HEROES[i],B1=HEROES[j];
    if(!A1.isPlayer&&!B1.isPlayer) continue;      // 两个都是 AI → 不推
    const dx=B1.x-A1.x, md=104;
    if(Math.abs(dx)<md&&!A1.airborne&&!B1.airborne){
      const s=(dx>=0?1:-1), p=(md-Math.abs(dx))/2*s;
      // 玩家被推得多一点(更有分量感), AI 被推得少
      const wa=A1.isPlayer?1:.35, wb=B1.isPlayer?1:.35;
      A1.x-=p*wa; B1.x+=p*wb;
    }
  }
  // 英杰 ↔ 小杜的推挤
  // ★ 上一版为了"并排站位"把 AI 这段整段禁掉了, 结果 AI 能走进小杜身体里 → 影分身重合。
  //   正确做法: 【AI 之间不互推】(保并排), 但【AI 与小杜要推】——
  //   推力全部作用在 AI 身上(小杜是沙包, 不该被推着跑), 把 AI 挡在小杜体表外。
  for(const h of HEROES){
    if(h.st==='ko') continue;
    const dx=DU.x-h.x;
    // 小杜的体表半径: 立绘 120 宽, 半宽 60, 加上身位余量
    const md=h.isPlayer?140:112;
    if(Math.abs(dx)<md){
      const s=(dx>=0?1:-1), p=(md-Math.abs(dx))*s;
      if(h.isPlayer){ h.x-=p*.85; DU.x+=p*.15; }
      else           { h.x-=p*1.0; }        // AI 全额退开, 小杜纹丝不动
    }
  }
  for(const h of HEROES){
    h.x=Math.max(70,Math.min(W-70,h.x));
    h.hpShow+=(h.hp-h.hpShow)*.10;
  }
  DU.x=Math.max(80,Math.min(W-80,DU.x));
  DU.hpShow+=(DU.hp-DU.hpShow)*.10;

  if(game.shake>0) game.shake*=.90;
  if(game.flashw>0) game.flashw-=.10;
  for(let i=game.hits.length-1;i>=0;i--){ game.hits[i].t++; if(game.hits[i].t>26) game.hits.splice(i,1); }
  if(game.banner){ game.banner.t++; if(game.banner.t>70) game.banner=null; }

  game.timer-=1/60;
  if(game.timer<=0) game.timer=99;                 // 三英战不设时限, 循环计时
  if(DU.hp<=0){
    game.ko++;
    if(game.ko>120){ game.state='over'; game.t=0; }
  }
}

function kamePath(g,len,r0,r1,wob){
  const N=22;
  const ry=k=>Math.sin(k*7.0-wob)*r0*0.10*Math.min(1,k*4);
  g.beginPath();
  for(let i=0;i<=N;i++){
    const k=i/N, x=k*len, rr=r0+(r1-r0)*k, y=ry(k);
    i?g.lineTo(x,y-rr):g.moveTo(x,y-rr);
  }
  for(let i=N;i>=0;i--){
    const k=i/N, x=k*len, rr=r0+(r1-r0)*k, y=ry(k);
    g.lineTo(x,y+rr);
  }
  g.closePath();
}
function drawKamehameha(g){
  for(const F of HEROES){
    if(F.st!=='super2') continue;
    const dir=F.facing;
    const hx=F.x+dir*26, hy=F.y-228;
    const t=F.t, chg=Math.min(1,t/BEAM_T);

    g.save();
    g.translate(hx,hy);
    if(dir<0) g.scale(-1,1);

    /* ---------- 蓄力 ---------- */
    if(t<BEAM_T){
      const r=10+56*chg;
      let rg=g.createRadialGradient(0,0,1,0,0,r*3.2);
      rg.addColorStop(0,'rgba(190,240,255,.50)');
      rg.addColorStop(.35,'rgba(70,150,255,.28)');
      rg.addColorStop(1,'rgba(20,60,220,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(0,0,r*3.2,0,6.29); g.fill();

      rg=g.createRadialGradient(0,-r*.2,r*.05,0,0,r);
      rg.addColorStop(0,'rgba(255,255,255,1)');
      rg.addColorStop(.42,'rgba(175,235,255,.98)');
      rg.addColorStop(.78,'rgba(70,155,255,.85)');
      rg.addColorStop(1,'rgba(20,80,230,.12)');
      g.fillStyle=rg; g.beginPath(); g.arc(0,0,r,0,6.29); g.fill();

      g.fillStyle='rgba(255,255,255,.95)';
      g.beginPath(); g.arc(0,-r*.12,r*.30,0,6.29); g.fill();

      g.lineCap='round';
      for(let a=0;a<2;a++){
        g.beginPath();
        for(let i=0;i<=26;i++){
          const k=i/26, ang=a*Math.PI+k*9.0+t*.16, rr=r*(1.55-k*0.72);
          const x=Math.cos(ang)*rr, y=Math.sin(ang)*rr*0.92;
          i?g.lineTo(x,y):g.moveTo(x,y);
        }
        g.strokeStyle='rgba(205,242,255,'+(.55*(1-chg*.30))+')';
        g.lineWidth=2.6; g.stroke();
      }
      for(let i=0;i<14;i++){
        const ph=((t*.055+i/14)%1);
        const d0=r*(3.4-2.3*ph), ang=i*2.399+t*.05;
        g.fillStyle='rgba(218,246,255,'+((1-ph)*.85)+')';
        g.beginPath(); g.arc(Math.cos(ang)*d0,Math.sin(ang)*d0*.9,1.6+ph*2.0,0,6.29); g.fill();
      }
      g.restore();
      continue;
    }

    /* ---------- 发射 ---------- */
    const k=Math.min(1,(t-BEAM_T)/10);
    const fade=t>BEAM_END-14?Math.max(0,(BEAM_END-t)/14):1;
    // 够得着对手时, 光束就停在他身上 —— 让尖端冲击球正好砸中他, 而不是飞出屏幕
    const foe=DU;
    const reach=(foe.x-F.x)*dir;
    const cap=(reach>150&&reach<1040&&foe.st!=='ko')?reach:1040;
    const len=Math.min(cap,1040)*k;
    const r0=22*k+5, r1=r0*2.45;   // 适度渐粗, 不是大喇叭
    g.globalAlpha=fade;

    // 三层: 羽化外晕 → 主体 → 白热核心
    // ★ 主体与核心必须用【正常混合模式】。原来整段包在 lighter 里,
    //   白心变成了"加法叠加", 打在暗背景上会发虚发透 —— 看着像半透明。
    //   现在: 外晕用 lighter(纯发光), 主体+核心用 source-over(实心)。
    g.save();
    // 外层羽化光晕才用加法
    g.globalCompositeOperation='lighter';
    kamePath(g,len,r0*2.15,r1*2.05,t*.05);
    const rgOut=g.createLinearGradient(0,-r1*2.05,0,r1*2.05);
    rgOut.addColorStop(0,'rgba(30,90,255,.20)');
    rgOut.addColorStop(.5,'rgba(150,220,255,.34)');
    rgOut.addColorStop(1,'rgba(30,90,255,.20)');
    g.fillStyle=rgOut; g.fill();
    g.restore();

    // ── 主体: 实心, 不透明
    g.save();
    g.globalCompositeOperation='source-over';
    kamePath(g,len,r0*1.28,r1*1.22,t*.05);
    const rg2=g.createLinearGradient(0,-r1*1.28,0,r1*1.28);
    rg2.addColorStop(0,'rgba(30,96,240,1)');
    rg2.addColorStop(.16,'rgba(66,150,255,1)');
    rg2.addColorStop(.34,'rgba(140,214,255,1)');
    rg2.addColorStop(.50,'rgba(226,248,255,1)');
    rg2.addColorStop(.66,'rgba(140,214,255,1)');
    rg2.addColorStop(.84,'rgba(66,150,255,1)');
    rg2.addColorStop(1,'rgba(30,96,240,1)');
    g.fillStyle=rg2; g.fill();
    // 上下边缘再加一条更亮的收边, 让光束有"壳"
    kamePath(g,len,r0*1.02,r1*0.98,t*.05);
    const rgE=g.createLinearGradient(0,-r1*1.02,0,r1*1.02);
    rgE.addColorStop(0,'rgba(150,220,255,.9)');
    rgE.addColorStop(.5,'rgba(255,255,255,0)');
    rgE.addColorStop(1,'rgba(150,220,255,.9)');
    g.fillStyle=rgE; g.fill();
    g.restore();

    // ── 白热核心: 完全不透明的纯白柱
    g.save();
    g.globalCompositeOperation='source-over';
    kamePath(g,len,r0*0.50,r1*0.48,t*.05);
    const rgC=g.createLinearGradient(0,-r1*0.50,0,r1*0.50);
    rgC.addColorStop(0,'rgba(255,255,255,1)');
    rgC.addColorStop(.42,'rgba(255,255,255,1)');
    rgC.addColorStop(.58,'rgba(255,255,255,1)');
    rgC.addColorStop(1,'rgba(255,255,255,1)');
    g.fillStyle=rgC; g.fill();
    g.restore();

    // 环状涟漪 + 螺旋流光带
    g.save();
    g.globalCompositeOperation='lighter';
    for(let i=0;i<10;i++){
      const ph=((t*0.030+i/10)%1);
      const x=(1-ph)*len;
      const rr=(r0+(r1-r0)*(x/Math.max(len,1)))*1.55;
      g.strokeStyle='rgba(195,238,255,'+((1-ph)*.40*fade)+')'; g.lineWidth=2.4;
      g.beginPath(); g.ellipse(x,0,rr*.30,rr,0,0,6.29); g.stroke();
    }
    for(let q=0;q<4;q++){
      const base=q*1.5708+t*0.16;
      g.beginPath();
      for(let i=0;i<=22;i++){
        const kk=i/22, x=kk*len, rr=(r0+(r1-r0)*kk)*0.86;
        const y=Math.sin(base+kk*8.0)*rr;
        i?g.lineTo(x,y):g.moveTo(x,y);
      }
      g.strokeStyle='rgba(235,250,255,'+(.30*fade)+')'; g.lineWidth=2.0; g.stroke();
    }
    g.restore();

    // 尖端冲击光球 —— 龙珠里真正"砸出去"的那一下
    const tr=r1*2.05;
    const rgt=g.createRadialGradient(len,0,tr*.03,len,0,tr);
    rgt.addColorStop(0,'rgba(255,255,255,1)');
    rgt.addColorStop(.28,'rgba(232,250,255,.98)');
    rgt.addColorStop(.55,'rgba(140,215,255,.72)');
    rgt.addColorStop(.80,'rgba(70,150,255,.30)');
    rgt.addColorStop(1,'rgba(30,90,255,0)');
    g.fillStyle=rgt; g.beginPath(); g.arc(len,0,tr,0,6.29); g.fill();
    // 冲击波双外环
    g.strokeStyle='rgba(232,250,255,'+(.70*fade)+')'; g.lineWidth=3.5;
    g.beginPath(); g.arc(len,0,tr*.66,0,6.29); g.stroke();
    g.strokeStyle='rgba(150,220,255,'+(.38*fade)+')'; g.lineWidth=2;
    g.beginPath(); g.arc(len,0,tr*.88,0,6.29); g.stroke();

    // 手部爆闪
    const hr=r0*2.6*(1+Math.sin(t*.8)*.10);
    const rgh=g.createRadialGradient(0,0,1,0,0,hr);
    rgh.addColorStop(0,'rgba(255,255,255,.95)');
    rgh.addColorStop(.5,'rgba(170,230,255,.55)');
    rgh.addColorStop(1,'rgba(60,140,255,0)');
    g.fillStyle=rgh; g.beginPath(); g.arc(0,0,hr,0,6.29); g.fill();

    g.restore();
  }
}


/* ---------- 单挑模式: 1v1 ---------- */
function endRoundDuel(w){
  let txt;
  if(w===null){ game.wins[0]++; game.wins[1]++; txt='平 局'; }
  else { game.wins[w]++; txt=(w===0?'闫祖 胜':'刘祖 胜'); }
  game.overText=txt;
  if(game.wins[0]>=2||game.wins[1]>=2){
    game.state='over'; game.t=0;
    game.overText=game.wins[0]>=2?'闫祖 胜':'刘祖 胜';
    return;
  }
  game.round++; game.newRoundDuel();
}
function stepDuel(){
  if(game.state==='ready'){
    game.t++;
    if(game.t===30) game.banner={txt:'战！',t:0};
    if(game.t>=70) game.state='fight';
    return;
  }
  if(game.state!=='fight'){ game.t++; return; }
  const P1=DUEL[0], P2=DUEL[1];
  const i1=(game.pick===-1)?allyInputDuel(P1,P2,2):readInput();
  const i2=(game.pick===-1||game.pick===0)?allyInputDuel(P2,P1,1):readInput2();
  P1.step(i1,P2); P2.step(i2,P1);
  clearEdge();
  if(!P1.airborne&&P1.st!=='atk'&&P1.st!=='hurt') P1.facing=(P2.x>=P1.x)?1:-1;
  if(!P2.airborne&&P2.st!=='atk'&&P2.st!=='hurt') P2.facing=(P1.x>=P2.x)?1:-1;
  const dx=P2.x-P1.x, md=150;
  if(Math.abs(dx)<md&&!P1.airborne&&!P2.airborne){
    const sg=(dx>=0?1:-1), pu=(md-Math.abs(dx))/2*sg;
    P1.x-=pu; P2.x+=pu;
    P1.x=Math.max(70,Math.min(W-70,P1.x));
    P2.x=Math.max(70,Math.min(W-70,P2.x));
  }
  P1.hpShow+=(P1.hp-P1.hpShow)*.10;
  P2.hpShow+=(P2.hp-P2.hpShow)*.10;
  if(game.shake>0) game.shake*=.90;
  if(game.flashw>0) game.flashw-=.10;
  for(let i=game.hits.length-1;i>=0;i--){ game.hits[i].t++; if(game.hits[i].t>26) game.hits.splice(i,1); }
  if(game.banner){ game.banner.t++; if(game.banner.t>70) game.banner=null; }
  game.timer-=1/60;
  if(game.timer<=0){
    if(P1.hp===P2.hp) return endRoundDuel(null);
    return endRoundDuel(P1.hp>P2.hp?0:1);
  }
  if(P1.hp<=0||P2.hp<=0){
    game.ko++;
    if(game.ko>115){
      const w=(P1.hp<=0&&P2.hp<=0)?null:(P1.hp<=0?1:0);
      endRoundDuel(w);
    }
  }
}
// 单挑里的电脑对手
function allyInputDuel(me,foe,lvl){
  const o={left:0,right:0,up:0,atkL:0,atkH:0,sup2:0};
  if(me.st==='ko'||game.state!=='fight') return o;
  me._ai=me._ai||{t:0,act:null,hold:0};
  const s=me._ai; s.t++;
  const d=Math.abs(foe.x-me.x), dir=(foe.x>me.x)?1:-1;
  const inL=(r)=> d>20 && d<r;
  if(s.hold>0) s.hold--; else s.act=null;
  if(!s.act&&s.t%9===0){
    const r=Math.random();
    if(me.meter>=100&&inL(700)){ s.act='beam'; s.hold=6; }
    else if(inL(200)){ s.act=(r<.6)?'atkH':'atkL'; s.hold=14+Math.random()*14; }
    else if(d<300){ s.act=(r<.5)?'atkL':'fwd'; s.hold=16+Math.random()*16; }
    else { s.act='fwd'; s.hold=18+Math.random()*14; }
  }
  switch(s.act){
    case 'fwd': if(dir>0)o.right=1; else o.left=1; break;
    case 'atkL': if(inL(230)) o.atkL=1; else { if(dir>0)o.right=1; else o.left=1; } break;
    case 'atkH': if(inL(280)) o.atkH=1; else { if(dir>0)o.right=1; else o.left=1; } break;
    case 'beam': o.sup2=1; break;
  }
  return o;
}

/* ---------- 渲染 ---------- */
function bar(g,x,y,w,h,val,rev,ghost,max){
  g.save();
  g.fillStyle='rgba(10,6,10,.85)'; g.fillRect(x-3,y-3,w+6,h+6);
  const mx=max||1000;
  const p=Math.min(1,Math.max(0,val)/mx), gp=Math.min(1,Math.max(0,ghost)/mx);
  g.fillStyle='rgba(255,255,255,.22)';
  if(rev) g.fillRect(x+w-w*gp,y,w*gp,h); else g.fillRect(x,y,w*gp,h);
  const grd=g.createLinearGradient(0,y,0,y+h);
  grd.addColorStop(0,'#f7c85c'); grd.addColorStop(.42,'#d8391f'); grd.addColorStop(1,'#7d1408');
  g.fillStyle=grd;
  if(rev) g.fillRect(x+w-w*p,y,w*p,h); else g.fillRect(x,y,w*p,h);
  g.fillStyle='rgba(255,255,255,.30)';
  if(rev) g.fillRect(x+w-w*p,y+2,w*p,h*.28); else g.fillRect(x,y+2,w*p,h*.28);
  g.strokeStyle='rgba(240,205,120,.85)'; g.lineWidth=2; g.strokeRect(x,y,w,h);
  g.restore();
}
function meterBar(g,x,y,w,val){
  g.save();
  g.fillStyle='rgba(10,6,10,.8)'; g.fillRect(x-2,y-2,w+4,13);
  const p=val/100;
  const grd=g.createLinearGradient(0,y,0,y+9);
  if(val>=100){ grd.addColorStop(0,'#fff6c9'); grd.addColorStop(1,'#f0a52a'); }
  else { grd.addColorStop(0,'#7fd8ff'); grd.addColorStop(1,'#1a6fa8'); }
  g.fillStyle=grd; g.fillRect(x,y,w*p,9);
  g.strokeStyle='rgba(200,180,120,.6)'; g.lineWidth=1; g.strokeRect(x,y,w,9);
  g.restore();
}
function face(g,img,x,y,s){
  if(!img) return;
  g.save(); g.beginPath(); g.rect(x,y,s,s); g.clip();
  g.drawImage(img,0,0,img.width,img.height,x,y,s,s);
  g.restore();
  g.strokeStyle='rgba(240,205,120,.8)'; g.lineWidth=2; g.strokeRect(x,y,s,s);
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  const sh=game.shake;
  ctx.save();
  if(sh>.4) ctx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  if(game.state==='title'){ drawTitle(); ctx.restore(); return; }

  ctx.drawImage(bg,0,0);
  ctx.save();
  for(const d of dust){
    d.y-=d.v; d.p+=.03; if(d.y<-6){ d.y=GROUND; d.x=Math.random()*W; }
    ctx.globalAlpha=.14+Math.abs(Math.sin(d.p))*.30;
    ctx.fillStyle='#ffd98a';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.29); ctx.fill();
  }
  ctx.restore();

  if(game.mode==='duel'){
    // 单挑: 只画两个英杰, 小杜隐藏
    const [A1,A2]=DUEL;
    const ord=(A1.y<=A2.y)?[A1,A2]:[A2,A1];
    ord.forEach(f=>f.draw(ctx));
  } else {
    // 英杰与小杜: 小杜最后画(他永远是沙包, 站C位)
    const order=[...HEROES.filter(h=>h.st==='ko'), ...HEROES.filter(h=>h.st!=='ko')];
    order.forEach(f=>f.draw(ctx));
    DU.draw(ctx);
  }

  for(const h of game.hits){
    const k=h.t/26, r=(h.poop?80:60)*(0.5+k*1.6);
    ctx.save(); ctx.globalAlpha=(1-k)*.9;
    const rg=ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,r);
    if(h.poop){
      rg.addColorStop(0,'rgba(190,140,80,.95)');
      rg.addColorStop(.4,'rgba(120,80,40,.7)');
      rg.addColorStop(1,'rgba(80,52,20,0)');
    } else {
      rg.addColorStop(0,'rgba(255,255,255,.95)');
      rg.addColorStop(.35,'rgba(255,216,110,.7)');
      rg.addColorStop(1,'rgba(255,140,30,0)');
    }
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(h.x,h.y,r,0,6.29); ctx.fill();
    if(!h.poop){
      ctx.strokeStyle='rgba(255,248,220,'+(1-k)+')'; ctx.lineWidth=4*(1-k)+1;
      for(let i=0;i<9;i++){
        const an=i/9*6.28+h.t*.06, r0=r*.4, r1=r*(1.0+k*.5);
        ctx.beginPath(); ctx.moveTo(h.x+Math.cos(an)*r0,h.y+Math.sin(an)*r0);
        ctx.lineTo(h.x+Math.cos(an)*r1,h.y+Math.sin(an)*r1); ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawHUD();
  if(game.banner) drawBanner(game.banner);
  if(game.flashw>0){
    ctx.fillStyle=game.flashc+Math.min(.9,game.flashw)+')';
    ctx.fillRect(0,0,W,H);
  }
  // 龟派气功最后画: 它本身是光源, 闪屏/横幅都不该盖住它
  drawKamehameha(ctx);

  ctx.restore();

  if(game.state==='over'){
    ctx.fillStyle='rgba(8,4,10,.66)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='500 88px "Songti SC",serif';
    ctx.fillStyle='#f5d97a'; ctx.shadowColor='rgba(255,180,40,.8)'; ctx.shadowBlur=30;
    ctx.fillText(game.mode==='duel'?(game.overText||''):'三 英 战 胜',W/2,300);
    ctx.shadowBlur=0;
    ctx.font='400 28px "PingFang SC",sans-serif';
    ctx.fillStyle='#d8c9a8';
    if(game.mode==='duel')
      ctx.fillText(DUEL[0].name+'  '+game.wins[0]+' : '+game.wins[1]+'  '+DUEL[1].name,W/2,368);
    else
      ctx.fillText('小杜 被 三 英 围 殴 至 倒 地',W/2,368);
    ctx.font='400 22px "PingFang SC",sans-serif';
    ctx.fillStyle='rgba(216,201,168,.7)';
    ctx.fillText('按 空格 返回标题',W/2,440);
  }
  if(game.state!=='over'&&game.state!=='title') drawTouch();
}
function drawTouch(){
  ctx.save(); ctx.textAlign='center';
  for(const b of BTN){
    const on=touch.p1[b.k];
    ctx.globalAlpha=on?1:.62;
    ctx.fillStyle=on?'rgba(255,226,150,.92)':'rgba(60,40,22,.55)';
    ctx.strokeStyle='rgba(240,214,138,.75)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle=on?'#2a1608':'rgba(240,214,138,.9)';
    ctx.font='500 30px "PingFang SC",sans-serif';
    ctx.fillText(b.lab,b.x+b.w/2,b.y+b.h/2+11);
  }
  ctx.restore();
}
function drawBanner(b){
  const a=b.t<10?b.t/10:(b.t>52?Math.max(0,(70-b.t)/18):1);

  const s=b.big?1.35:1;

  ctx.restore();
}

  ctx.font='500 78px "Songti SC",serif';
  ctx.lineWidth=10; ctx.strokeStyle='rgba(24,8,4,.95)';
  const MTITLE=game.mode==='duel'?'刘 祖 闫 祖 帝 王 对 决':'三 英 战 小 杜';
  ctx.strokeText(MTITLE,W/2,126);
  const gr=ctx.createLinearGradient(0,74,0,152);
  gr.addColorStop(0,'#fff6cd'); gr.addColorStop(.45,'#eec247'); gr.addColorStop(1,'#9a5f0e');
  ctx.fillStyle=gr; ctx.fillText(MTITLE,W/2,126);

  ctx.font='400 21px "PingFang SC",sans-serif';
  ctx.fillStyle='rgba(230,214,180,.82)';
  const duel=game.mode==='duel';
  // 模式切换按钮
  ctx.font='500 19px "PingFang SC",sans-serif';
  const mw=ctx.measureText('Q').width+56;
  ctx.fillStyle=duel?'rgba(255,120,60,.30)':'rgba(240,214,138,.20)';
  ctx.strokeStyle=duel?'rgba(255,150,90,.9)':'rgba(240,214,138,.8)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(W-mw-40,44,mw,34,6) : ctx.rect(W-mw-40,44,mw,34);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffe9a8';
  ctx.fillText('Q 切换模式',W-mw-12,68);
  ctx.textAlign='left';
  ctx.font='500 18px "PingFang SC",sans-serif';
  ctx.fillStyle='rgba(240,214,138,.85)';
  ctx.fillText('当前：'+(duel?'刘 祖 闫 祖 单 挑':'三 英 战 小 杜'),44,68);
  ctx.textAlign='center';

  ctx.fillText(duel?'刘 祖 与 闫 祖 帝 王 对 决':'选 一 位 英 杰 陪 你 围 殴 小 杜',W/2,172);

  const blink=.55+Math.abs(Math.sin(t*.06))*.45;
  ctx.font='500 22px "PingFang SC",sans-serif';
  ctx.globalAlpha=blink; ctx.fillStyle='#f0d68a';
  ctx.fillText(duel?'1 闫祖(你) VS 刘祖(AI)　2 反过来　3 电脑对电脑':'按  1 / 2 / 3  选 择 角 色',W/2,214);
  ctx.globalAlpha=1;

  ctx.font='400 17px "PingFang SC",sans-serif';
  ctx.fillStyle='rgba(210,196,168,.78)';
  if(duel){
    ctx.fillText('P1 闫祖：A/D 移动 · W 跳 · F 轻掌 · G 重掌 · T 龟派气功',W/2,262);
    ctx.fillText('P2 刘祖：←/→ 移动 · ↑ 跳 · J 轻掌 · K 重掌 · L 龟派气功',W/2,290);
    ctx.fillStyle='rgba(210,196,168,.52)';
    ctx.fillText('三局两胜　·　气满时可放龟派气功（有霸体，不会被打断）',W/2,320);
  } else {
    ctx.fillText('操作：A/D 移动 · W 跳 · F 轻掌 · G 重掌 · T 龟派气功　　另外两位 AI 会自动围攻',W/2,262);
    ctx.fillStyle='rgba(210,196,168,.52)';
    ctx.fillText('小杜没有攻击力，技能（投翔 / 红温 / 无能狂怒）一次都不会让你掉血',W/2,292);
    ctx.fillText('目标：把小杜那 4200 血打到归零',W/2,316);
  }

  // 立绘: 上半屏留空, 四人从 400 开始往下站。前三张是可选角色
  const cast = duel
    ? [[A.yc_idle||A.yan_idle,0],[A.liu_idle,1]]
    : [[A.yc_idle||A.yan_idle,0],[A.liu_idle,1],[A.wu_idle,2],[A.du_idle,3]];
  const sc=0.50, slot=W/cast.length;
  cast.forEach(([a,i])=>{
    if(!a||!a.n) return;
    const x=slot*(i+.5), y=H-42+Math.sin(t*.03+i)*5;
    const sel=i<3, num=i+1;
    // 可选角色背后加光圈, 高亮当前所指
    if(sel){
      ctx.save();
      const glow=ctx.createRadialGradient(x,y-150,20,x,y-150,190);
      glow.addColorStop(0,'rgba(255,205,110,.30)'); glow.addColorStop(1,'rgba(255,190,80,0)');
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(x,y-150,190,0,6.29); ctx.fill();
      ctx.restore();
    }
    ctx.save(); ctx.globalAlpha=i===3?.95:.92;
    ctx.shadowColor='rgba(0,0,0,.65)'; ctx.shadowBlur=26;
    const w=a.n.width*sc, h=a.n.height*sc;
    ctx.drawImage(a.n,x-w/2,y-h,w,h);
    ctx.restore();
    // 名字牌: 可选角色带按键编号
    const nm=sel?(HEROES[i].name+'  ['+num+']'):'小杜';
    void nm;
    ctx.font='500 17px "PingFang SC",sans-serif';
    const tw=ctx.measureText(nm).width+22;
    ctx.fillStyle='rgba(12,6,10,.82)'; ctx.fillRect(x-tw/2,y+4,tw,26);
    ctx.strokeStyle=sel?'rgba(240,214,138,.95)':'rgba(255,120,80,.9)';
    ctx.lineWidth=sel?2:1.5; ctx.strokeRect(x-tw/2,y+4,tw,26);
    ctx.fillStyle=sel?'#f0d68a':'#ff9a70';
    ctx.fillText(nm,x,y+23);
  });
}

/* ---------- 触摸 ---------- */
const BTN=[
  {k:'l',x:40,y:560,w:86,h:86,lab:'◀'},
  {k:'r',x:142,y:560,w:86,h:86,lab:'▶'},
  {k:'j',x:196,y:462,w:86,h:86,lab:'跳'},
  {k:'f',x:1130,y:462,w:86,h:86,lab:'掌'},
  {k:'g',x:1130,y:560,w:86,h:86,lab:'重'}
];
let activeT={};
function tStart(ev){
  if(game.state!=='fight') return;
  ev.preventDefault(); game.touch=true;
  for(const t of (ev.touches||[ev])){
    const r=cv.getBoundingClientRect();
    const pt={x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};
    let k=null;
    for(const b of BTN) if(pt.x>b.x&&pt.x<b.x+b.w&&pt.y>b.y&&pt.y<b.y+b.h){ k=b.k; break; }
    if(k){ activeT[t.identifier]=k; touch.p1[k]=1;
      if(k==='f')touch.p1.f=1; if(k==='g')touch.p1.g=1; }
  }
}
function tEnd(ev){
  ev.preventDefault();
  for(const t of (ev.changedTouches||[ev])){
    const k=activeT[t.identifier];
    if(k){ touch.p1[k]=0; delete activeT[t.identifier]; }
  }
}
cv.addEventListener('touchstart',tStart,{passive:false});
cv.addEventListener('touchmove',tStart,{passive:false});
cv.addEventListener('touchend',tEnd,{passive:false});
cv.addEventListener('touchcancel',tEnd,{passive:false});

/* ---------- 主循环 ---------- */
function start(){ window.__G={game,HEROES,DU,DUEL,A}; requestAnimationFrame(loop); }
var last=0, acc=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!last) last=t;
  let dt=Math.min(60,t-last); last=t; acc+=dt;
  let guard=0;
  while(acc>=1000/FPS && guard++<5){ stepPhase(); acc-=1000/FPS; game.frames++; }
  render();
}

</script>
